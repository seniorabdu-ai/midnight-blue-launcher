plugins { id 'com.android.application' }

android {
    namespace 'com.midnightblue.launcher'
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        applicationId 'com.midnightblue.launcher'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '2.0-premium'
    }
}
